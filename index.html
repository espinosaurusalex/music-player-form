<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilo/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Formulário de entrada</title>
</head>

<body>


    <main class="container">

        <audio src="./musica/pool.mp3"  id="musica" loop ></audio>
        <form id="form-login">
            <h1>Login</h1>


            <div class="input-box">
                <input type="text" id="nome" placeholder="digite o nome" required>
                <i class="bx bxs-user"></i>

            </div>

            <div class="input-box">

                <input type="password" id="senha" placeholder="senha" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <p id="mensagem-erro"></p>

            <button type="submit" class="login">Login</button>

        </form>
    </main>

    <script src="./js/script.js"></script>


    <footer >
        <span>Desenvolvido por <span class="denji">Denji</span></span>
    </footer>
</body>

</html>
